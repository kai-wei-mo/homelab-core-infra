apiVersion: batch/v1
kind: Job
metadata:
  name: karina-bucket
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bucket
          image: harbor.home.chaewon.io/kaiweimo/discord-bot-klairti:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: karina-config
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: karina-minio
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: karina-minio
                  key: secret-key
          command: ["python", "-c", "import db; db._s3()"]

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich

resources:
  - backup-configmap.yaml
  - backup-cronjobs.yaml
  - install.yaml
  - library-pv.yaml
  - library-pvc.yaml
  - postgres-cluster.yaml
  - sealed-backup-secret.yaml
  - sealed-db-owner-secret.yaml

# Immich chart defaults lag app releases
# and suggests we upgrade versions ourselves.
images:
  - name: ghcr.io/immich-app/immich-server
    newTag: v3.4.2
  - name: ghcr.io/immich-app/immich-machine-learning
    newTag: v3.4.2

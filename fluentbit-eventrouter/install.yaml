# Source: fluent-bit/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit-eventrouter
  namespace: logging
  labels:
    helm.sh/chart: fluent-bit-0.58.3
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/instance: fluent-bit-eventrouter
    app.kubernetes.io/version: "5.1.3"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
      app.kubernetes.io/instance: fluent-bit-eventrouter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/instance: fluent-bit-eventrouter
      annotations:
        checksum/config: 4168143b3fb5eaa7caabc3b6869034910afb563bd3779e183f6aab8f4d1b127d
    spec:
      
      serviceAccountName: fluent-bit-eventrouter
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
        - name: fluent-bit
          image: "ghcr.io/fluent/fluent-bit:5.1.3"
          imagePullPolicy: IfNotPresent
          command:
            - /fluent-bit/bin/fluent-bit
          args:
            - --workdir=/fluent-bit/etc
            - --config=/fluent-bit/etc/conf/fluent-bit.yaml
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: http
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/conf
            - mountPath: /fluent-bit/state
              name: flb-state
      volumes:
        - name: config
          configMap:
            name: fluent-bit-eventrouter
        - emptyDir: {}
          name: flb-state

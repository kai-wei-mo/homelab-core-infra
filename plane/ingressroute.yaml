apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plane-ingress
  namespace: plane
spec:
  entryPoints:
    - websecure
  routes:
    # Higher priority than the catch-all `/` route (Traefik default priority
    # can otherwise send /god-mode to plane-web).
    - match: Host(`plane.home.chaewon.io`) && PathPrefix(`/spaces`)
      kind: Rule
      priority: 100
      middlewares:
        - name: plane-trailing-slash
        - name: plane-body-limit
      services:
        - name: plane-space
          port: 3000
    - match: Host(`plane.home.chaewon.io`) && PathPrefix(`/god-mode`)
      kind: Rule
      priority: 100
      middlewares:
        - name: plane-trailing-slash
        - name: plane-body-limit
      services:
        - name: plane-admin
          port: 3000
    - match: Host(`plane.home.chaewon.io`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-api
          port: 8000
    - match: Host(`plane.home.chaewon.io`) && PathPrefix(`/auth`)
      kind: Rule
      priority: 100
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-api
          port: 8000
    - match: Host(`plane.home.chaewon.io`) && PathPrefix(`/live`)
      kind: Rule
      priority: 100
      middlewares:
        - name: plane-trailing-slash
        - name: plane-body-limit
      services:
        - name: plane-live
          port: 3000
    - match: Host(`plane.home.chaewon.io`) && PathPrefix(`/uploads`)
      kind: Rule
      priority: 100
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-minio
          port: 9000
    - match: Host(`plane.home.chaewon.io`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-web
          port: 3000
  tls:
    secretName: home-chaewon-io-wildcard

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: plane

resources:
  - sealed-plane-app-secrets.yaml
  - sealed-plane-pgdb-secrets.yaml
  - sealed-plane-rabbitmq-secrets.yaml
  - sealed-plane-doc-store-secrets.yaml
  - sealed-plane-live-secrets.yaml
  - slash-redirect.yaml
  - install.yaml

# Chart PathPrefix routes send /god-mode to admin nginx, which 301s to :3000.
# Insert a 302 trailing-slash middleware ahead of the service (regex is exact
# path only, so /god-mode/ is unchanged).
patches:
  - path: patch-web-url.yaml
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: plane-ingress
    patch: |-
      - op: add
        path: /spec/routes/0/middlewares/0
        value:
          name: plane-trailing-slash
      - op: add
        path: /spec/routes/1/middlewares/0
        value:
          name: plane-trailing-slash
      - op: add
        path: /spec/routes/5/middlewares/0
        value:
          name: plane-trailing-slash
      - op: add
        path: /spec/routes/7/middlewares/0
        value:
          name: plane-root-to-god-mode


# Chart hardcodes WEB_URL as http:// even when TLS is enabled via tls_secret_name.
# Access is https://plane.home.chaewon.io
# Mismatched scheme breaks auth/CORS and can surface as React hydration error #418.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-app-vars
  namespace: plane
data:
  WEB_URL: "https://plane.home.chaewon.io"
  CORS_ALLOWED_ORIGINS: "https://plane.home.chaewon.io"

# Chart hardcodes WEB_URL=http:// even when TLS is on. Plane's own docs
# want WEB_URL and CORS_ALLOWED_ORIGINS to match the browser origin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-app-vars
  namespace: plane
data:
  WEB_URL: "https://plane.home.chaewon.io"
  CORS_ALLOWED_ORIGINS: "https://plane.home.chaewon.io"

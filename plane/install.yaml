metadata:
  namespace: plane
  name: plane-minio-wl
  labels:
    helm.sh/chart: plane-ce-1.6.2
    app.kubernetes.io/name: plane-ce
    app.kubernetes.io/instance: plane
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.4.1"
spec:
  selector:
    matchLabels:
      app.name: plane-plane-minio
  serviceName:  plane-minio
  template:
    metadata:
      labels:
        app.name: plane-plane-minio
        helm.sh/chart: plane-ce-1.6.2
        app.kubernetes.io/name: plane-ce
        app.kubernetes.io/instance: plane
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "1.4.1"
    spec:
      containers:
      - image: minio/minio:latest
        imagePullPolicy: IfNotPresent
        name: plane-minio
        stdin: true
        tty: true
        # command:
        args:
          - server
          - /data
          - --console-address 
          - :9090
        envFrom:
          - secretRef:
              name: plane-doc-store-secrets
              optional: false
        volumeMounts:
        - mountPath: /data
          name: pvc-plane-minio-vol
          subPath: ''
      serviceAccount: plane-srv-account
      serviceAccountName: plane-srv-account
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      namespace: plane
      name: pvc-plane-minio-vol
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: "10Gi"
      storageClassName: 
      volumeMode: Filesystem

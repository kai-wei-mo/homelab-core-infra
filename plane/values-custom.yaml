planeVersion: v1.5.0

ingress:
  enabled: true
  appHost: plane.home.chaewon.io
  minioHost: ""
  rabbitmqHost: ""
  ingressClass: traefik

ssl:
  createIssuer: false
  generateCerts: false
  tls_secret_name: home-chaewon-io-wildcard

postgres:
  local_setup: true
  volumeSize: 5Gi

redis:
  local_setup: true
  volumeSize: 1Gi

rabbitmq:
  local_setup: true
  volumeSize: 1Gi

# Headless (clusterIP: None) services make Traefik return 503 for /api/*.
minio:
  local_setup: true
  volumeSize: 10Gi
  assign_cluster_ip: true

web:
  assign_cluster_ip: true

space:
  assign_cluster_ip: true

admin:
  assign_cluster_ip: true

live:
  assign_cluster_ip: true

api:
  assign_cluster_ip: true
  cpuRequest: 250m
  memoryRequest: 256Mi

external_secrets:
  app_env_existingSecret: plane-app-secrets
  pgdb_existingSecret: plane-pgdb-secrets
  rabbitmq_existingSecret: plane-rabbitmq-secrets
  doc_store_existingSecret: plane-doc-store-secrets
  live_env_existingSecret: plane-live-secrets

env:
  cors_allowed_origins: "https://plane.home.chaewon.io"
  pgdb_name: plane
  pgdb_username: plane

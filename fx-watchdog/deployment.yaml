apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-watchdog
  labels:
    app: fx-watchdog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-watchdog
  template:
    metadata:
      labels:
        app: fx-watchdog
    spec:
      containers:
        - name: fx-watchdog
          image: harbor.home.chaewon.io/kaiweimo/fx-watchdog:0.1.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fx-watchdog
          env:
            - name: WISE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wise-token
                  key: token
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord
                  key: webhook-url
            - name: DISCORD_PING_USER_ID
              valueFrom:
                secretKeyRef:
                  name: discord
                  key: ping-user-id
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

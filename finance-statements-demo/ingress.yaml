apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-statements-demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: statements-demo.chaewon.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance-statements-demo
                port:
                  number: 8000
    - host: statements-demo.home.chaewon.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance-statements-demo
                port:
                  number: 8000
  tls:
    - secretName: home-chaewon-io-wildcard
      hosts:
        - statements-demo.home.chaewon.io

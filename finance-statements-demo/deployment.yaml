apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-statements-demo
  labels:
    app: finance-statements-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-statements-demo
  template:
    metadata:
      labels:
        app: finance-statements-demo
    spec:
      containers:
        - name: finance-statements-demo
          image: kaiweimo/finance-statements:0.2.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FINANCES_OUTPUT_DIR
              value: /app/output
            - name: FINANCES_STATIC_DIR
              value: /app/frontend/dist
          volumeMounts:
            - name: data
              mountPath: /app/output
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          secret:
            secretName: finance-statements-demo-data
        - name: tmp
          emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault

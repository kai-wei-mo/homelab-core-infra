apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: harbor

resources:
  - sealed-harbor-credentials.yaml
  - install.yaml

# The chart writes the bundled database password into a Secret. Core reads
# harbor-credentials instead. Drop that Secret and point Postgres at the same
# sealed secret so the password is not stored in git.
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-database
        namespace: harbor
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: harbor-database
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/envFrom
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-credentials
              key: password
